<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{ page.description | default: page.title | escape }}">
  <meta name="theme-color" content="#84b9cb">
  <title>{{ page.title }} — asa-hanada</title>
  <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}">
</head>
<body>
  <a class="skip-link" href="#main">本文へ移動</a>
  <header class="site-header">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="トップページ">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>asa-hanada</span>
    </a>
    <nav class="site-nav" aria-label="メインナビゲーション">
      <a href="{{ '/writings/' | relative_url }}">書き物</a>
      <a href="{{ '/pdf/' | relative_url }}">PDF等</a>
      <a href="{{ '/projects/' | relative_url }}">その他制作物</a>
      <a href="https://github.com/asa-hanada" target="_blank" rel="noreferrer">GitHub ↗</a>
    </nav>
  </header>

  <main id="main" class="article-main">
    <article class="diary-entry">
      <header class="article-header">
        <p class="article-kind">DIARY</p>
        <h1>{{ page.title }}</h1>
        <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
      </header>
      <div class="article-body">
        {{ content }}
      </div>
    </article>
    <nav class="article-nav" aria-label="記事ナビゲーション">
      <a class="back-link" href="{{ '/writings/diary/' | relative_url }}">← 日記一覧へ</a>
    </nav>
  </main>

  <footer class="site-footer">
    <p>© <span id="year">2026</span> asa-hanada</p>
    <p>Built slowly, kept openly.</p>
    <a href="#main">PAGE TOP ↑</a>
  </footer>
  <script src="{{ '/assets/script.js' | relative_url }}"></script>
</body>
</html>
